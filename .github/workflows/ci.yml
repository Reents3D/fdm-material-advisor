name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci

      # Data gates run FIRST: a schema or provenance violation should fail before
      # anyone looks at the code. The database is the product.
      - name: JSON Schema
        run: npm run validate:schema
      - name: Plausibilität und Provenienz
        run: npm run validate:plausibility

      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

      # Bundle-Budget. Die Logik und die Begruendung der beiden Grenzen stehen in
      # scripts/check-bundle.mjs; hier steht nur der Aufruf.
      #
      # Warum als Skript und nicht mehr als Shell-Schritt: Diese Pruefung lief bis zum
      # 2026-08-04 NUR hier und nicht in `npm run ci`. Zweimal hintereinander - beim
      # OFD-Import und beim FormFutura-Import - war lokal alles gruen und das Budget
      # trotzdem gerissen. Eine Grenze, die man erst nach dem Push sieht, kommt zu spaet.
      # Sie laeuft jetzt am Ende von `npm run ci` und damit auch hier ueber diesen Schritt.
      - name: Bundle-Budget
        run: npm run check:bundle
