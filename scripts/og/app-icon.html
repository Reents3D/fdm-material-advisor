<!doctype html>
<!--
  Quelle der App-Symbole (PWA-Manifest und Apple-Touch-Icon).

  Die Bildmarke steht auf einem petrolfarbenen Feld mit reichlich Rand: Android und iOS
  beschneiden Symbole zu Kreisen oder abgerundeten Quadraten (maskable icon). Wer die
  Marke bis an den Rand setzt, verliert sie in der Maske. Die 20 % Sicherheitsabstand
  hier entsprechen der Vorgabe für maskierbare Symbole.

  NEU ERZEUGEN (Playwright ist bewusst keine Projektabhängigkeit):
    for s in 192 512; do
      npx --yes playwright@latest screenshot --viewport-size=$s,$s \
        --wait-for-timeout=800 scripts/og/app-icon.html public/icon-$s.png
    done
    npx --yes playwright@latest screenshot --viewport-size=180,180 \
      --wait-for-timeout=800 scripts/og/app-icon.html public/apple-touch-icon.png
-->
<html lang="de">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    background: #0C4251;
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: 60%; height: 60%; }
</style>
</head>
<body>
  <!-- Bildmarke inline statt als <img>: nur so lassen sich die beiden Pfade getrennt
       einfaerben - Koerper weiss, Akzentbalken im Hellblau des CD. -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="64.5 62.3 158.8 158.8">
  <!-- Bildmarke der Reents Technologies GmbH, unveraendert aus dem Logo herausgeloest.
       viewBox quadratisch um den gemessenen Bereich der beiden Pfade - nicht geschaetzt,
       sondern per getBBox() im Browser bestimmt. Farben wie im Original: Logos werden
       nicht umgefaerbt. -->

</svg>
</body>
</html>
